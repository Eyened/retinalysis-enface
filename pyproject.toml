[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "retinalysis-enface"
dynamic = ["version"]
description = "Utilities for analyzing retinal enface images"
authors = [{ name = "Jose Vargas", email = "j.vargasquiros@erasmusmc.nl" }]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8, <3.15"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "opencv-python>=4,<5",
    "matplotlib>=3.7,<4",
    "joblib>=1,<2",
    "tqdm>=4,<5",
    "Pillow>=10,<12",
    "click>=8,<9",
    "pydicom>=2.4,<4; sys_platform != 'emscripten'",
    "scikit-image>=0.21,<1",
]

[project.optional-dependencies]
fundusprep = [
    "retinalysis-fundusprep >= 0.6.1",
]
test = [
    "pytest == 8.*",
    "retinalysis-fundusprep >= 0.6.1",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
packages = ["rtnls_enface"]

[project.scripts]
# Add any CLI scripts here if needed

[project.urls]
"Homepage" = "https://github.com/Eyened/retinalysis-enface"
"Bug Tracker" = "https://github.com/Eyened/retinalysis-enface/issues"

[tool.pytest.ini_options]
markers = [
    "plotting: smoke tests for plotting methods"
]
testpaths = ["tests"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"